# J-ed 2.0.1 (lot 2) — tests automatiques sur GitHub (GitHub Actions, gratuit pour un dépôt public).
#
# À chaque envoi sur « main » ou une branche « evolution-… », et à chaque demande de fusion vers « main » :
# une machine Ubuntu de GitHub installe Python 3.12, PostgreSQL 15 (comme en production) et les polices japonaises
# de l'image Docker, puis lance tous les tests sur une base vide. Données fictives uniquement ; aucun secret,
# aucune clé : le mot de passe ci-dessous ne sert qu'à la base de test, effacée à la fin.
# Les tests des scripts PowerShell tournent aussi (PowerShell 7 est déjà installé sur les machines de GitHub) ;
# l'étape échoue si un test est ignoré.
# Résultats : onglet « Actions » du dépôt. Lancement à la main : Actions → Tests → Run workflow.

name: Tests

on:
  push:
    branches: [main, "evolution-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.12, PostgreSQL 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: jed
          POSTGRES_PASSWORD: jed
          POSTGRES_DB: jed_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jed -d jed_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://jed:jed@localhost:5432/jed_dev
      DJANGO_DEBUG: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les polices japonaises (comme l'image Docker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-ipaexfont-mincho fonts-ipaexfont-gothic fonts-hanazono

      - name: Installer les dépendances Python
        # tblib sert seulement aux tests : sans lui, l'erreur d'un test lancé en parallèle est illisible.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tblib

      - name: Afficher les versions utilisées
        run: |
          python --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          psql --version || true

      - name: Contrôles de Django
        run: python manage.py check

      - name: Aucune migration manquante
        run: python manage.py makemigrations --check --dry-run

      - name: Tests complets
        shell: bash
        run: |
          set -o pipefail
          python manage.py test tests --noinput --parallel 4 2>&1 | tee resultats-tests.txt
          if grep -q "skipped=" resultats-tests.txt; then
            echo "::error::Des tests ont été ignorés (voir « skipped » ci-dessus) : ils doivent tous tourner."
            exit 1
          fi
