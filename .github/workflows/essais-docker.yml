# J-ed 2.0.3 — « Essais Docker » : J-ed installé, mis à jour, sauvegardé et restauré avec le VRAI Docker, sous Linux.
#
# Une machine Ubuntu de GitHub (Docker Engine, Docker Compose et PowerShell 7 déjà installés, compte ordinaire,
# gratuite pour un dépôt public) suit tests/outils/essai-docker.ps1 : installation, jeu d'essai, vérification,
# sauvegarde, mises à jour « construction impossible » (code 3), « démarrage impossible » (code 4) et réussie
# (code 0), restauration dans une nouvelle installation, vérification après migration, réinitialisation de l'essai,
# menu texte. Données fictives uniquement ; aucun secret ; tout est effacé avec la machine à la fin.
# Autres scénarios : « depuis la 2.0.2 » (la version publiée, mise à jour par le menu j-ed.sh, comme chez
# l'utilisateur) et « derrière un proxy » (accès direct au web coupé, seul un proxy d'essai sort :
# tests/outils/reseau-proxy-essai.sh ; l'essai tourne alors sous un compte « essai » distinct de celui de GitHub).
# Ne remplace pas les essais chez l'utilisateur : Windows, vrai proxy du réseau, affichage (Firefox, raccourcis).
#
# Lancement, en particulier avant chaque version candidate :
#  - par un envoi sur la branche « essais-docker » (seulement elle ; GitHub ne montre le bouton « Run workflow »
#    que pour un flux présent sur la branche principale, ce qui n'est pas le cas avant la version définitive) ;
#  - à la main (Actions → Essais Docker → Run workflow), une fois le flux arrivé sur « main ».
# Les journaux (scripts, mises à jour, docker compose logs) sont joints au résultat (« Artifacts »).

name: Essais Docker

on:
  workflow_dispatch:
  push:
    branches:
      - essais-docker

permissions:
  contents: read

concurrency:
  group: essais-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  essais-docker:
    name: Essais Docker (${{ matrix.nom }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 : la même version que la machine de l'utilisateur ; 24.04 gardée pour comparer.
          - nom: Ubuntu 26.04
            os: ubuntu-26.04
            fichier: ubuntu-26.04
            scenario: complet
            proxy: false
          - nom: Ubuntu 24.04
            os: ubuntu-24.04
            fichier: ubuntu-24.04
            scenario: complet
            proxy: false
          - nom: Ubuntu 26.04, depuis la 2.0.2 par le menu
            os: ubuntu-26.04
            fichier: ubuntu-26.04-depuis-2.0.2
            scenario: depuis-2.0.2
            proxy: false
          - nom: Ubuntu 26.04, derrière un proxy
            os: ubuntu-26.04
            fichier: ubuntu-26.04-proxy
            scenario: complet
            proxy: true
          - nom: Ubuntu 26.04, depuis la 2.0.2 par le menu, derrière un proxy
            os: ubuntu-26.04
            fichier: ubuntu-26.04-depuis-2.0.2-proxy
            scenario: depuis-2.0.2
            proxy: true
          # Le cas de la machine de l'utilisateur : proxy réglé dans les réglages d'Ubuntu, que le menu doit trouver seul.
          - nom: Ubuntu 26.04, depuis la 2.0.2 par le menu, proxy des réglages d'Ubuntu
            os: ubuntu-26.04
            fichier: ubuntu-26.04-depuis-2.0.2-proxy-ubuntu
            scenario: depuis-2.0.2
            proxy: true
            ubuntu: true

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Afficher les versions utilisées
        run: |
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker compose version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          id
          df -h "$RUNNER_TEMP" /var/lib/docker

      - name: Compte d'essai et réseau derrière un proxy d'essai
        if: matrix.proxy
        run: |
          sudo useradd --create-home --shell /bin/bash --groups docker essai
          sudo mkdir -p /srv/essai
          sudo cp -a "$GITHUB_WORKSPACE" /srv/essai/code
          sudo chown -R essai:essai /srv/essai
          # Dossiers propres au compte « essai » (sinon sudo garde ceux du compte de GitHub : dconf y écrirait).
          sudo install -d -o essai -g essai -m 700 "/run/user/$(id -u essai)"
          bash tests/outils/reseau-proxy-essai.sh essai "$RUNNER_TEMP/proxy.txt"

      - name: Essai complet
        if: ${{ !matrix.proxy }}
        run: pwsh -NoProfile -File tests/outils/essai-docker.ps1 -Dossier "$RUNNER_TEMP/essai-docker" -Scenario "${{ matrix.scenario }}"

      - name: Essai complet, derrière le proxy d'essai (compte « essai »)
        if: matrix.proxy && !matrix.ubuntu
        run: >-
          sudo -u essai env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_CACHE_HOME
          GITHUB_ACTIONS=true HOME=/home/essai XDG_RUNTIME_DIR="/run/user/$(id -u essai)"
          pwsh -NoProfile -File /srv/essai/code/tests/outils/essai-docker.ps1 -Dossier /srv/essai/travail
          -Scenario "${{ matrix.scenario }}" -Proxy "$(cat "$RUNNER_TEMP/proxy.txt")"

      - name: Essai complet, proxy des réglages d'Ubuntu (compte « essai », session D-Bus)
        if: matrix.proxy && matrix.ubuntu
        run: >-
          sudo -u essai env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_CACHE_HOME
          GITHUB_ACTIONS=true HOME=/home/essai XDG_RUNTIME_DIR="/run/user/$(id -u essai)"
          dbus-run-session --
          pwsh -NoProfile -File /srv/essai/code/tests/outils/essai-docker.ps1 -Dossier /srv/essai/travail
          -Scenario "${{ matrix.scenario }}" -Proxy "$(cat "$RUNNER_TEMP/proxy.txt")" -ProxyDansUbuntu

      - name: Rassembler les journaux du compte « essai »
        if: always() && matrix.proxy
        run: |
          mkdir -p "$RUNNER_TEMP/essai-docker/journaux"
          sudo cp -r /srv/essai/travail/journaux/. "$RUNNER_TEMP/essai-docker/journaux/" || true
          sudo cp /var/log/tinyproxy/tinyproxy.log "$RUNNER_TEMP/essai-docker/journaux/" || true
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/essai-docker"
          echo "Passé par le proxy d'essai (nombre de connexions par adresse) :"
          sudo grep -oE 'CONNECT [^ ]+' /var/log/tinyproxy/tinyproxy.log | sort | uniq -c | sort -rn | head -20 || true
          echo "Refusé par le pare-feu (connexions directes bloquées) :"
          sudo iptables -L OUTPUT -v -n | grep REJECT || true
          sudo iptables -L DOCKER-USER -v -n | grep REJECT || true

      - name: Joindre les journaux
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: journaux-essais-docker-${{ matrix.fichier }}
          path: ${{ runner.temp }}/essai-docker/journaux
          if-no-files-found: warn
          retention-days: 14

  # Windows : le Docker des machines de GitHub ne fait tourner que des conteneurs Windows, J-ed n'y démarre pas.
  # Les scripts y sont essayés avec le vrai Windows PowerShell 5.1 sur ce qui ne demande pas J-ed en marche.
  essais-windows:
    name: Essais Windows (${{ matrix.os }}, Windows PowerShell 5.1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Essai Windows
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/outils/essai-windows.ps1 -Dossier "$env:RUNNER_TEMP\essai-windows"

      - name: Joindre les journaux
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: journaux-essais-windows-${{ matrix.os }}
          path: ${{ runner.temp }}/essai-windows/journaux
          if-no-files-found: warn
          retention-days: 14
