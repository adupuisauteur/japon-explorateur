{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1></div></div>
<div class="card-soft" style="max-width:640px">
  <form method="post">{% csrf_token %}{% include "partials/form.html" %}
    <button class="btn btn-primary">Enregistrer</button> <a class="btn btn-link" href="{% url 'accounts:users' %}">Annuler</a></form>
  {% if target and target != user %}<hr><a class="text-danger small" href="{% url 'accounts:user_anonymize' target.pk %}"><i class="bi bi-person-x"></i> Supprimer les données personnelles de ce compte</a>{% endif %}
</div>
{% endblock %}
