{# 2.0.0, lot 2 : trois filtres indépendants (remplacent « Document numérisé »). #}
<div class="mb-2"><label class="form-label" for="f-st-notice">Notice disponible</label><select id="f-st-notice" name="status_notice" class="form-select form-select-sm"><option value="">Indifférent</option><option value="oui"{% if current.status_notice == 'oui' %} selected{% endif %}>Oui</option><option value="non"{% if current.status_notice == 'non' %} selected{% endif %}>Non</option><option value="non_verifie"{% if current.status_notice == 'non_verifie' %} selected{% endif %}>Non vérifié</option></select></div>
<div class="mb-2"><label class="form-label" for="f-st-document">Document consultable</label><select id="f-st-document" name="status_document" class="form-select form-select-sm"><option value="">Indifférent</option><option value="oui"{% if current.status_document == 'oui' %} selected{% endif %}>Oui</option><option value="non"{% if current.status_document == 'non' %} selected{% endif %}>Non</option><option value="non_verifie"{% if current.status_document == 'non_verifie' %} selected{% endif %}>Non vérifié</option></select></div>
<div class="mb-2"><label class="form-label" for="f-st-iiif">IIIF</label><select id="f-st-iiif" name="status_iiif" class="form-select form-select-sm"><option value="">Indifférent</option><option value="verifie"{% if current.status_iiif == 'verifie' %} selected{% endif %}>Vérifié</option><option value="identifie"{% if current.status_iiif == 'identifie' %} selected{% endif %}>Identifié</option><option value="echec"{% if current.status_iiif == 'echec' %} selected{% endif %}>Vérification en échec</option><option value="absent"{% if current.status_iiif == 'absent' %} selected{% endif %}>Absent</option><option value="non_verifie"{% if current.status_iiif == 'non_verifie' %} selected{% endif %}>Non vérifié</option></select></div>
