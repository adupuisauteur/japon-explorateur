{% load app_tags %}{% if page.has_other_pages %}
<nav aria-label="Pagination"><ul class="pagination pagination-sm flex-wrap">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="{% qs_replace page=page.previous_page_number %}">Précédent</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} élément(s)</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="{% qs_replace page=page.next_page_number %}">Suivant</a></li>{% endif %}
</ul></nav>
{% endif %}
